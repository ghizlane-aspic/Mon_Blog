# Docker Compose for Mon_Blog: PHP app + MySQL + phpMyAdmin
# - Uses a named volume for persistent DB data
# - Loads initial schema from MonBlog.sql on first run
# - Env vars are sourced from .env to avoid committing secrets
# - Restart policy keeps services up unless manually stopped
version: "3.9"

services:
  # MySQL database service
  db:
    image: mysql:8.0
    # Automatically restart unless explicitly stopped by the user
    restart: unless-stopped
    # Load environment variables from .env (keeps secrets out of this file)
    env_file: .env
    # Pass through DB configuration; values come from .env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      # Persist MySQL data between container restarts
      - db_data:/var/lib/mysql
      # Auto-load initial schema/data on first run
      - ./MonBlog.sql:/docker-entrypoint-initdb.d/MonBlog.sql:ro
    
  # PHP/Apache web app built from local Dockerfile
  web:
    build: .
    # Keep the container running across reboots unless manually stopped
    restart: unless-stopped
    env_file: .env
    # App-level DB connection settings (must match the DB service and .env)
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
    volumes:
      # Mount project files for live development inside the container
      - ./:/var/www/html
    # Ensure DB starts before web; note this is not a health check
    depends_on:
      - db
    ports:
      # Map host HTTP port to container's Apache port (80); value comes from .env
      - "${WEB_HTTP_PORT}:80"

  # phpMyAdmin UI for MySQL
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # Connect phpMyAdmin to the 'db' service by default
      - PMA_HOST=db
      - PMA_PORT=3306
      # Optional: increase import/upload size if needed
      - UPLOAD_LIMIT=64M
    ports:
      # Expose phpMyAdmin on host; reuse existing var and map to container port 80
      - "${ADMINER_HTTP_PORT}:80"

# Named volumes declared here for portability and clarity
volumes:
  db_data:
